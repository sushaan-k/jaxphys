name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAX_PLATFORMS: cpu

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests examples benchmarks

      - name: Ruff format check
        run: ruff format --check src tests examples benchmarks

      - name: Mypy type check
        run: mypy src/jaxphys

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run tests
        run: pytest --cov=jaxphys --cov-report=term-missing

      - name: Benchmark smoke run (checks results against NumPy)
        if: matrix.python-version == '3.12'
        run: python examples/bench.py --quick --repeats 1

      - name: Benchmark and validation suite, quick mode (~2 min)
        if: matrix.python-version == '3.12'
        run: python -m benchmarks.run --quick --out /tmp/bench-results

  package:
    name: Build & wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("jaxphys/__init__.py", "jaxphys/py.typed", "jaxphys/em/fdtd.py"):
              assert required in names, f"{required} missing from wheel"
          print(f"{len(names)} files in wheel")
          EOF

      - name: Install wheel into a clean venv and import it
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import jaxphys; print(jaxphys.__version__); assert jaxphys.__version__ != '0+unknown'"
